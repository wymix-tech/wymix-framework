id: travelsky_dev_test
category: tool
maintainer: internal
description: 测试基础设施（Testcontainers 数据库容器 + DBUnit Excel 数据集）
required: false
requires: []
bootVersions: ["travelsky_dev_v3"]
dependencies:
  - groupId: com.travelsky.base
    artifactId: travelsky_dev_test
    scope: test
linkages:
