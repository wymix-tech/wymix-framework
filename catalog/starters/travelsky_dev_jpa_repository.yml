id: travelsky_dev_jpa_repository
category: data
maintainer: internal
description: JPA 持久化实现（审计填充、变更日志、数据权限、查询 DSL 翻译）
required: false
requires: [travelsky_dev_repository]
bootVersions: ["3.5.8"]
dependencies:
  - groupId: com.travelsky.base
    artifactId: travelsky_dev_jpa_repository
linkages:
  abstract-classes:
    - fqcn: "com.travelsky.base.repository.jpa.audit.domain.AbstractAuditEntity"
      alias: abstractAuditEntity
    - fqcn: "com.travelsky.base.repository.jpa.api.BaseRepository"
      alias: baseRepository
    - fqcn: "com.travelsky.base.repository.jpa.api.AbstractBaseServiceImpl"
      alias: abstractBaseServiceImpl
  application-yml-fragments:
    - source: "starters/travelsky_dev_jpa_repository/application-jpa-repository.yml"
      merge-strategy: append
