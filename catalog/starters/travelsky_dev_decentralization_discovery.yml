description: 去中心化服务发现（JmDNS/mDNS，Leader 选举与心跳，默认关闭）
required: false
requires: [travelsky_dev_core, travelsky_dev_threadpool]
bootVersions: ["3.5.8"]
dependencies:
  - groupId: com.travelsky.base
    artifactId: travelsky_dev_decentralization_discovery
linkages:
  abstract-classes:
