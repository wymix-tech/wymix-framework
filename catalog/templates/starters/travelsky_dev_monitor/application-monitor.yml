# travelsky_dev_monitor —— Actuator + Micrometer/Prometheus 可观测性
# 装配开关 travelsky.monitor.enabled；开启时监听器会注入下列 Actuator 默认值
# （注入源位于属性源列表最后，业务配置可覆盖）
travelsky:
  monitor:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: %24{spring.application.name:app}
