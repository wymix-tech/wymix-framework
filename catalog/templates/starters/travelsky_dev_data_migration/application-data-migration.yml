# travelsky_dev_data_migration —— 数据迁移
# 装配开关 travelsky.data-migration.enabled
# 注意：data.migration.* 前缀的 DataMigrationProperties 当前未注册为 Bean，写入不会生效
travelsky:
  data-migration:
    enabled: true

# 变更日志（数据迁移的事件来源，由 ORM 模块装配）
data-changelog:
  enabled: true
data:
  changelog:
    # 变更日志实体扫描包，多个用逗号分隔
    basePackages: %24{DATA_CHANGELOG_PACKAGES:}
