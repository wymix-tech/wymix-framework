# travelsky_dev_jpa_repository —— JPA 持久化实现
travelsky:
  jpa:
    # JPA 基础装配（审计字段自动填充）
    enabled: true
    data-permission:
      # 是否注册数据权限切面 DataPermissionAspect
      # 同时引入 MyBatis 侧 @EnableDataPermission 时建议设为 false，只保留一个切面实例
      enabled: true

# 变更日志开关与实体扫描包
data-changelog:
  enabled: true
data:
  changelog:
    basePackages: %24{DATA_CHANGELOG_PACKAGES:}

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
