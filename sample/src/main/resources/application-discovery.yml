# decentralization_discovery 示例配置
# 该能力默认关闭：需 decentralization.discovery.enable=true 才会装配节点服务、选主与集群广播
# 启用方式：在 application.yml 的 spring.profiles.active 中追加 discovery
decentralization:
  discovery:
    enable: true
    # 节点命名空间（写入 NodeInfo.namespace，用于区分环境/集群）
    namespace: sample
    # 服务名 -> 节点地址列表（集群成员的唯一来源，形如 host:port，不要写 http:// 前缀）
    service:
      sample:
        - 127.0.0.1:8080
