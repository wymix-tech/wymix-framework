# Spring Boot 3.5 原生默认执行器与调度器；async.* 参数仅保留显式值的兼容映射。
spring:
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 300
    scheduling:
      pool:
        size: 4

# 自定义新的线程池
# 需要引入Maven依赖 org.wymix.framework.threadpool
thread-pool:
  pool:
    # 自动创建BeanName=testThreadPool的线程池，在项目各处使用时，可以直接通过@Autowired的方式进行注入，注意需要通过@Qualifier对应beanName
    testThreadPool:
      corePoolSize: 5
      maxPoolSize: 10
  scheduled:
    # 自动创建BeanName=testScheduledThreadPool的调度线程池，在项目各处使用时，可以直接通过@Autowired的方式进行注入，注意需要通过@Qualifier对应beanName
    testScheduledThreadPool:
      corePoolSize: 2