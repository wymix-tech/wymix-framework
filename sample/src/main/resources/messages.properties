# i18n 默认（en_US）文案
# 由 MessageSourceAutoConfiguration 按 spring.messages.basename（默认 messages）加载，
# 业务代码通过 org.wymix.framework.web.i18n.MessageResourceHelper 读取，
# 全局异常处理器（ControllerResponseAdvice）也会用这里的 code 渲染错误信息。
demo.greeting=Hello, wymix_dev!
demo.business.error=This is a demo business exception
demo.valid.name=name must not be blank
demo.valid.age=age must be between 1 and 120
repeat.request=Duplicate submission, please retry after {0} ms
