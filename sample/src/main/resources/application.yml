spring:
  application:
    name: sample
  profiles:
    # datasource/security：基础能力
    # cache：缓存(application-cache.yml)
    # async：异步与自定义线程池(application-async.yml，threadpool 模块的 testThreadPool 在此定义)
    # 按需追加：discovery（去中心化服务发现）、dynamicDatasource（动态数据源）
    active: datasource,security,cache,async

# 模块开关汇总（均为默认开启，置 false 可关闭对应自动装配）
travelsky:
  core:
    enabled: true
  monitor:
    enabled: true
  mybatis:
    enabled: true
  threadpool:
    enabled: true
  data-migration:
    enabled: true
async:
  enabled: true
cache:
  enabled: true
# 数据变更日志（data_migration 依赖该事件）
data-changelog:
  enabled: true
