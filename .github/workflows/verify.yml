name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B clean verify
      - run: ./mvnw -B -DskipTests install
      - run: ./mvnw -B -f sample/pom.xml -Pmybatis -DskipTests package
      - run: ./mvnw -B -f sample/pom.xml -Pjpa -DskipTests clean package
